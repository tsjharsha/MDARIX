# Who may connect to the staging database (docker-compose.staging-oracle.yml). Rules are read top to bottom.
#
# TYPE     DATABASE  USER  ADDRESS     METHOD
# Inside the container, over the Unix socket: the operating-system user must match the database user
# ("docker compose exec -u postgres postgres psql").
local      all       all               peer
# Over the network (the private Docker network only; no port is published): TLS and a password, always.
hostssl    all       all   0.0.0.0/0   scram-sha-256
hostssl    all       all   ::/0        scram-sha-256
# Anything without TLS is refused.
hostnossl  all       all   0.0.0.0/0   reject
hostnossl  all       all   ::/0        reject
