# Local test copy for the attack-style security scans (scripts/security_scan.sh). Sample data only, never a copy of
# customer or production data. Start it only through the scan script, which sets the project name "mdarix-scan" and a
# generated env file with random test values:
#
#   COMPOSE_PROJECT_NAME=mdarix-scan docker compose -f infrastructure/security-scan/docker-compose.scan.yml \
#     --env-file <generated scan.env> up -d --wait
#
# No container names and no fixed volume names, so nothing here can collide with the development stack
# (docker-compose.yml: mdarix-r1-postgres on 5433). Published ports listen on 127.0.0.1 only.
name: mdarix-scan

services:
  scan-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${SCAN_POSTGRES_DB:-mdarix_scan_test}
      POSTGRES_USER: mdarix_app
      POSTGRES_PASSWORD: ${SCAN_POSTGRES_PASSWORD:?generated by scripts/security_scan.sh}
    ports:
      - "127.0.0.1:${SCAN_DB_PORT:-15433}:5432"
    volumes:
      - scan_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdarix_app -d ${SCAN_POSTGRES_DB:-mdarix_scan_test}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: migrate and load the synthetic test fixtures (scripts/prepare_test_environment.py, test-gated).
  scan-seed:
    image: mdarix-scan/api:${SCAN_RELEASE:-local}
    build: {context: ../.., dockerfile: Dockerfile.api}
    user: root
    environment: &app_env
      MDARIX_ENV: test
      POSTGRES_HOST: scan-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${SCAN_POSTGRES_DB:-mdarix_scan_test}
      POSTGRES_USER: mdarix_app
      POSTGRES_PASSWORD: ${SCAN_POSTGRES_PASSWORD}
      MDARIX_DB_HARDENING_APPLY: "1"
      DAY35_FIXTURE_PASSWORD: ${SCAN_FIXTURE_PASSWORD:?generated by scripts/security_scan.sh}
      MDARIX_RLS_SYSTEM_TOKEN: ${SCAN_RLS_SYSTEM_TOKEN}
      MDARIX_MFA_ENCRYPTION_KEY: ${SCAN_MFA_KEY}
      MDARIX_CONNECTOR_ENCRYPTION_KEY: ${SCAN_CONNECTOR_KEY}
      MDARIX_OBJECT_STORAGE_ENCRYPTION_KEY: ${SCAN_OBJECT_KEY}
      MDARIX_OBJECT_STORAGE_SIGNING_SECRET: ${SCAN_SIGNING_SECRET}
      MDARIX_OBJECT_STORAGE_PROVIDER: local
      MDARIX_OBJECT_STORAGE_ROOT: /var/lib/mdarix/objects
      MDARIX_REPORT_TEMP_ROOT: /var/lib/mdarix/reports
      MDARIX_GENAI_PROVIDER: controlled
      MDARIX_EMBEDDING_PROVIDER: local
      # No mail leaves the test copy: the host never resolves.
      MDARIX_SMTP_HOST: smtp.invalid
      # Password for the least-privilege runtime role; configure_runtime_role.py gives the role its login.
      MDARIX_DB_RUNTIME_PASSWORD: ${SCAN_RUNTIME_PASSWORD:?generated by scripts/security_scan.sh}
    command: ["sh", "-c", "python scripts/prepare_test_environment.py && python scripts/configure_runtime_role.py"]
    depends_on:
      scan-db: {condition: service_healthy}
    restart: "no"

  scan-api:
    image: mdarix-scan/api:${SCAN_RELEASE:-local}
    environment:
      <<: *app_env
      # Development mode serves /openapi.json for the API scans; every protection that is not environment-gated stays on.
      MDARIX_ENV: development
      MDARIX_ALLOWED_ORIGINS: http://scan-api:8000
      # Requests run as the runtime role under row-level security, as in production.
      MDARIX_DB_RUNTIME_USER: mdarix_runtime
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    ports:
      - "127.0.0.1:${SCAN_API_PORT:-18000}:8000"
    depends_on:
      scan-seed: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  scan_db_data:
