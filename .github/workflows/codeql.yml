name: CodeQL
# Static security analysis of the Python and TypeScript code on every pull request and weekly. The repository is
# private without code-scanning upload, so the results are kept as a build artifact and the job fails on any finding
# rated high or critical (security severity 7.0 or above).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: read
  actions: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          category: /language:${{ matrix.language }}
          upload: never
          output: codeql-results
      - name: Fail on high and critical findings
        run: |
          python - <<'PY'
          import glob, json, sys
          serious = []
          for path in glob.glob("codeql-results/*.sarif"):
              for run in json.load(open(path))["runs"]:
                  rules = {rule["id"]: rule for rule in run["tool"]["driver"].get("rules", [])}
                  for result in run.get("results", []):
                      rule = rules.get(result.get("ruleId"), {})
                      severity = float(rule.get("properties", {}).get("security-severity", 0) or 0)
                      where = result["locations"][0]["physicalLocation"]
                      line = f"{severity:>4}  {result.get('ruleId')}  {where['artifactLocation']['uri']}:{where.get('region', {}).get('startLine')}"
                      print(line)
                      if severity >= 7.0:
                          serious.append(line)
          print(f"{len(serious)} high or critical finding(s)")
          sys.exit(1 if serious else 0)
          PY
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codeql-${{ matrix.language }}
          path: codeql-results
          if-no-files-found: warn
