name: Release
# A release is a git tag vX.Y.Z matching the VERSION file. This builds the three production images (api, web, backup),
# scans each with Trivy (a HIGH or CRITICAL finding not reviewed in .trivyignore.yaml stops the release before anything
# is pushed), pushes them to GitHub Container Registry as ghcr.io/<owner>/<repo>/{api,web,backup}:<tag> and publishes a
# GitHub release whose notes record each image's digest. Servers pull exactly these images (docs/runbooks/DEPLOYMENT.md); rolling back
# means running the previous tag.
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: mdarix-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    # The self-hosted Linux runner when the repository variable CI_LINUX_RUNNER names it (as in ci.yml), else a
    # GitHub-hosted one. The images are built for x86 (linux/amd64), which the self-hosted WSL runner also is.
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    permissions:
      contents: write   # the GitHub release
      packages: write   # the images
      id-token: write   # keyless image signatures (Sigstore)
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: The tag matches VERSION
        run: |
          test "${GITHUB_REF_NAME}" = "v$(tr -d '[:space:]' < VERSION)" \
            || { echo "Tag ${GITHUB_REF_NAME} does not match VERSION ($(cat VERSION))"; exit 1; }
      - name: Image names
        id: names
        run: |
          # Registry paths must be lower case.
          echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build the images
        env:
          REPOSITORY: ${{ steps.names.outputs.repository }}
        run: |
          docker build -f Dockerfile.api -t "$REPOSITORY/api:$GITHUB_REF_NAME" .
          docker build -f Dockerfile.web -t "$REPOSITORY/web:$GITHUB_REF_NAME" .
          docker build -f infrastructure/docker/backup/Dockerfile -t "$REPOSITORY/backup:$GITHUB_REF_NAME" .
      - name: Scan the images (high and critical findings stop the release unless reviewed in .trivyignore.yaml)
        env:
          REPOSITORY: ${{ steps.names.outputs.repository }}
        run: |
          for image in api web backup; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/.trivyignore.yaml:/review/.trivyignore.yaml:ro" aquasec/trivy:0.57.0 image \
              --exit-code 1 --severity CRITICAL,HIGH --ignorefile /review/.trivyignore.yaml --no-progress \
              "$REPOSITORY/$image:$GITHUB_REF_NAME"
          done
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the images and record their digests
        env:
          REPOSITORY: ${{ steps.names.outputs.repository }}
        run: |
          {
            echo "## Images"
            echo
            echo "Set \`MDARIX_RELEASE=${GITHUB_REF_NAME}\` and \`MDARIX_IMAGE_REPOSITORY=${REPOSITORY}\` in .env.production,"
            echo "then follow docs/runbooks/DEPLOYMENT.md (section 3). Pull by digest to be certain of the bytes:"
            echo
            echo '| Image | Digest |'
            echo '|---|---|'
          } > release-notes.md
          for image in api web backup; do
            docker push "$REPOSITORY/$image:$GITHUB_REF_NAME"
            digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$REPOSITORY/$image:$GITHUB_REF_NAME")
            echo "| \`$image\` | \`$digest\` |" >> release-notes.md
          done
          {
            echo
            echo "## Changes"
            echo
            echo "See CHANGELOG.md for ${GITHUB_REF_NAME#v}."
          } >> release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
      # A cell operator verifies an image before upgrading (docs/runbooks/CELL_LINK.md): the signature names this
      # workflow and this repository as the signer, through GitHub's OIDC identity; no key to lose or rotate.
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
      - name: Sign the images by digest
        env:
          REPOSITORY: ${{ steps.names.outputs.repository }}
        run: |
          for image in api web backup; do
            digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$REPOSITORY/$image:$GITHUB_REF_NAME")
            cosign sign --yes "$digest"
          done
          {
            echo
            echo "## Verify before you upgrade"
            echo
            echo '```'
            echo "cosign verify --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com ${REPOSITORY}/api:${GITHUB_REF_NAME}"
            echo '```'
            echo
            echo "The software bill of materials of each image (SPDX) is attached to this release."
          } >> release-notes.md
      - name: Software bill of materials for each image
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          image: ${{ steps.names.outputs.repository }}/api:${{ github.ref_name }}
          format: spdx-json
          output-file: sbom-api.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          image: ${{ steps.names.outputs.repository }}/web:${{ github.ref_name }}
          format: spdx-json
          output-file: sbom-web.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          image: ${{ steps.names.outputs.repository }}/backup:${{ github.ref_name }}
          format: spdx-json
          output-file: sbom-backup.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: release-notes.md
          files: |
            sbom-api.spdx.json
            sbom-web.spdx.json
            sbom-backup.spdx.json
          fail_on_unmatched_files: false
