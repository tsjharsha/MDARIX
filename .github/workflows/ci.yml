name: MDARIX R1 CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: mdarix-r1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: mdarix_app
      POSTGRES_PASSWORD: mdarix_app
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_DB: mdarix_r1
      # The migration chain includes the explicit database-hardening gate.
      # CI uses the freshly provisioned PostgreSQL service, so it is safe to
      # apply the runtime-role and RLS migration during the isolated run.
      MDARIX_DB_HARDENING_APPLY: '1'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mdarix_app
          POSTGRES_PASSWORD: mdarix_app
          POSTGRES_DB: mdarix_r1
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U mdarix_app -d mdarix_r1"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install pip-audit
      - run: python -m pip check
      - run: pip-audit -r requirements.txt
      - name: Apply complete schema and runtime hardening
        run: alembic upgrade head
      - name: Seed deterministic test identities
        env:
          DAY35_FIXTURE_APPLY: '1'
          DAY35_FIXTURE_PASSWORD: 'LegacyTestPassword123!'
        run: python scripts/provision_day35_fixture.py
      - name: Seed deterministic investigation data
        run: python scripts/seed_demo_expansion.py
      - run: python -m compileall backend auth access_control counterfactual graph scenario_intelligence
      - run: python -m pytest -q
      - name: Validate compose configuration
        run: docker compose config --quiet
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm.cmd --prefix frontend ci
      - run: npm.cmd --prefix frontend audit --audit-level=high
      - run: npm.cmd --prefix frontend run build
      - name: Run frontend tests
        run: npm.cmd --prefix frontend test -- --run

  browser:
    name: Browser and accessibility evidence
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npx --prefix frontend playwright install --with-deps chromium
      - name: Run browser smoke and accessibility checks
        run: npm --prefix frontend run test:e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mdarix-browser-evidence
          path: |
            frontend/artifacts
            frontend/test-results
          if-no-files-found: warn

  local-validation-report:
    name: Local validation report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/validate_local_stack.py
      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: mdarix-local-validation-report
          path: artifacts/local-stack-validation.json

  container-validation:
    name: Container and simulator validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose definition
        run: docker compose config --quiet
      - name: Build simulator and worker images
        run: docker compose build --no-cache mdarix-outbox-worker trackwise-simulator plm-simulator erp-simulator supplier-simulator

  security:
    name: Security and static gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt pip-audit ruff
      - run: pip-audit -r requirements.txt
      - run: ruff check backend auth access_control integration outbox scripts
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integration:
    name: Simulator and integration gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: docker compose config --quiet
      - run: docker compose up -d postgres mailpit minio trackwise-simulator plm-simulator erp-simulator supplier-simulator veeva-qms-simulator teamcenter-simulator oracle-erp-simulator coupa-simulator
      - run: python scripts/validate_local_stack.py
      - run: python -m pytest -q tests/test_source_simulator.py tests/test_persistent_source_simulator.py tests/test_api_connector_contract.py tests/test_connector_security.py
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mdarix-integration-evidence
          path: artifacts
          if-no-files-found: warn

  release-report:
    name: Release evidence gate
    runs-on: ubuntu-latest
    needs: [backend, frontend, browser, local-validation-report, container-validation, security, integration]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Enforce required CI jobs
        shell: bash
        run: |
          test "${{ needs.backend.result }}" = success
          test "${{ needs.frontend.result }}" = success
          test "${{ needs.browser.result }}" = success
          test "${{ needs.local-validation-report.result }}" = success
          test "${{ needs.container-validation.result }}" = success
          test "${{ needs.security.result }}" = success
          test "${{ needs.integration.result }}" = success
      - name: Publish workflow summary
        shell: bash
        run: |
          {
            echo '## MDARIX R1 CI/CD validation'
            echo '- Backend tests, migrations, dependency checks, and compose validation: passed'
            echo '- Frontend tests, audit, and production build: passed'
            echo '- Worker and simulator container builds: passed'
            echo '- Production deployment promotion and rollback remain environment-specific gates.'
          } >> "$GITHUB_STEP_SUMMARY"
