name: MDARIX R1 CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: mdarix-r1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: mdarix_app
      POSTGRES_PASSWORD: mdarix_app
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_DB: mdarix_r1
      # The migration chain includes the explicit database-hardening gate.
      # CI uses the freshly provisioned PostgreSQL service, so it is safe to
      # apply the runtime-role and RLS migration during the isolated run.
      MDARIX_DB_HARDENING_APPLY: '1'
      # Disposable CI services run with development conveniences; an unset MDARIX_ENV means production.
      MDARIX_ENV: development
      # The API connects as the least-privilege runtime role, so tests exercise Postgres row-level security.
      MDARIX_DB_RUNTIME_USER: mdarix_runtime
      MDARIX_DB_RUNTIME_PASSWORD: ci-runtime-${{ github.run_id }}-${{ github.run_attempt }}-disposable
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mdarix_app
          POSTGRES_PASSWORD: mdarix_app
          POSTGRES_DB: mdarix_r1
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U mdarix_app -d mdarix_r1"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # The hashed runtime lock, then the development tools (pytest, pip-audit, ruff) from their own file.
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: pip-audit -r requirements.txt
      - name: Cache the local embedding model
        uses: actions/cache@v4
        with:
          path: .model-cache
          key: embedding-model-bge-small-en-v1.5-fastembed-0.8.1
      - name: Apply complete schema and runtime hardening
        run: alembic upgrade head
      - name: Give the runtime role a login
        run: python scripts/configure_runtime_role.py
      - name: Seed deterministic test identities
        env:
          DAY35_FIXTURE_APPLY: '1'
          DAY35_FIXTURE_PASSWORD: 'LegacyTestPassword123!'
        run: python scripts/provision_day35_fixture.py
      - name: Seed deterministic investigation data
        run: python scripts/seed_demo_expansion.py
      - run: python -m compileall backend auth access_control counterfactual graph scenario_intelligence
      - run: python -m pytest -q
      - name: Validate compose configuration
        run: docker compose config --quiet
  dedicated-plane:
    name: Dedicated data plane
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: mdarix_app
      POSTGRES_PASSWORD: mdarix_app
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_DB: mdarix_r1
      MDARIX_DB_HARDENING_APPLY: '1'
      MDARIX_ENV: development
      MDARIX_DB_RUNTIME_USER: mdarix_runtime
      MDARIX_DB_RUNTIME_PASSWORD: ci-runtime-${{ github.run_id }}-${{ github.run_attempt }}-disposable
      # An empty second database server that the tests migrate as a customer's dedicated plane.
      MDARIX_TEST_DATA_PLANE_URL: postgresql+pg8000://mdarix_plane:mdarix_plane@localhost:5434/mdarix_plane
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mdarix_app
          POSTGRES_PASSWORD: mdarix_app
          POSTGRES_DB: mdarix_r1
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U mdarix_app -d mdarix_r1"
          --health-interval=10s --health-timeout=5s --health-retries=10
      plane:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mdarix_plane
          POSTGRES_PASSWORD: mdarix_plane
          POSTGRES_DB: mdarix_plane
        ports: ['5434:5432']
        options: >-
          --health-cmd="pg_isready -U mdarix_plane -d mdarix_plane"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: python scripts/configure_runtime_role.py
      - name: Seed deterministic test identities
        env:
          DAY35_FIXTURE_APPLY: '1'
          DAY35_FIXTURE_PASSWORD: 'LegacyTestPassword123!'
        run: python scripts/provision_day35_fixture.py
      - name: Plane migration, routing, schema gate, export and deletion
        run: python -m pytest -q tests/test_dedicated_plane.py

  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm.cmd --prefix frontend ci
      - run: npm.cmd --prefix frontend audit --audit-level=high
      - run: npm.cmd --prefix frontend run build
      - run: npm.cmd --prefix frontend run lint
      - run: npm.cmd --prefix frontend run format:check
      - name: Run frontend tests
        run: npm.cmd --prefix frontend test -- --run

  browser:
    name: Browser and accessibility evidence
    runs-on: ubuntu-latest
    needs: frontend
    env:
      POSTGRES_USER: mdarix_app
      POSTGRES_PASSWORD: mdarix_app
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_DB: mdarix_r1
      MDARIX_DB_HARDENING_APPLY: '1'
      # Disposable CI services run with development conveniences; an unset MDARIX_ENV means production.
      MDARIX_ENV: development
      # The API connects as the least-privilege runtime role, so tests exercise Postgres row-level security.
      MDARIX_DB_RUNTIME_USER: mdarix_runtime
      MDARIX_DB_RUNTIME_PASSWORD: ci-runtime-${{ github.run_id }}-${{ github.run_attempt }}-disposable
      DAY35_FIXTURE_APPLY: '1'
      # Disposable per-run password for the seeded fixture accounts (never a shared or real password).
      DAY35_FIXTURE_PASSWORD: ci-fixture-${{ github.run_id }}-${{ github.run_attempt }}-Aa1!
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mdarix_app
          POSTGRES_PASSWORD: mdarix_app
          POSTGRES_DB: mdarix_r1
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U mdarix_app -d mdarix_r1"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: alembic upgrade head
      - run: python scripts/configure_runtime_role.py
      - run: python scripts/provision_day35_fixture.py
      - name: Start backend
        shell: bash
        run: |
          nohup python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8007 > backend.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8007/health/live >/dev/null; then exit 0; fi
            sleep 2
          done
          cat backend.log
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npx --prefix frontend playwright install --with-deps chromium
      - name: Run browser smoke and accessibility checks
        run: npm --prefix frontend run test:e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mdarix-browser-evidence
          path: |
            frontend/artifacts
            frontend/test-results
          if-no-files-found: warn

  local-validation-report:
    name: Local validation report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/validate_local_stack.py
      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: mdarix-local-validation-report
          path: artifacts/local-stack-validation.json

  container-validation:
    name: Container and simulator validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose definition
        run: docker compose config --quiet
      - name: Build simulator and worker images
        run: docker compose build --no-cache mdarix-outbox-worker trackwise-simulator plm-simulator erp-simulator supplier-simulator

  security:
    name: Security and static gates
    runs-on: ubuntu-latest
    # gitleaks reads the pull request's commits to scan them.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # ruff is pinned (requirements-dev.txt) to the version used to format the repository.
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: pip-audit -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integration:
    name: Simulator and integration gates
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: mdarix_app
      POSTGRES_PASSWORD: mdarix_app
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_DB: mdarix_r1
      MDARIX_DB_HARDENING_APPLY: '1'
      # Disposable CI services run with development conveniences; an unset MDARIX_ENV means production.
      MDARIX_ENV: development
      # The API connects as the least-privilege runtime role, so tests exercise Postgres row-level security.
      MDARIX_DB_RUNTIME_USER: mdarix_runtime
      MDARIX_DB_RUNTIME_PASSWORD: ci-runtime-${{ github.run_id }}-${{ github.run_attempt }}-disposable
      DAY35_FIXTURE_APPLY: '1'
      # Disposable per-run password for the seeded fixture accounts (never a shared or real password).
      DAY35_FIXTURE_PASSWORD: ci-fixture-${{ github.run_id }}-${{ github.run_attempt }}-Aa1!
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mdarix_app
          POSTGRES_PASSWORD: mdarix_app
          POSTGRES_DB: mdarix_r1
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U mdarix_app -d mdarix_r1"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: docker compose config --quiet
      - run: alembic upgrade head
      - run: python scripts/configure_runtime_role.py
      - run: python scripts/provision_day35_fixture.py
      # MinIO is an optional local object-storage service. The hosted runner
      # does not require it for the contract/integration tests below, and the
      # upstream image is not reliably pullable from the runner registry.
      - run: docker compose up -d postgres mailpit trackwise-simulator plm-simulator erp-simulator supplier-simulator veeva-qms-simulator teamcenter-simulator oracle-erp-simulator coupa-simulator
      - run: python scripts/validate_local_stack.py
      - run: python -m pytest -q tests/test_persistent_source_simulator.py tests/test_api_connector_contract.py tests/test_connector_security.py
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mdarix-integration-evidence
          path: artifacts
          if-no-files-found: warn

  release-report:
    name: Release evidence gate
    runs-on: ubuntu-latest
    needs: [backend, dedicated-plane, frontend, browser, local-validation-report, container-validation, security, integration]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Enforce required CI jobs
        shell: bash
        run: |
          test "${{ needs.backend.result }}" = success
          test "${{ needs.dedicated-plane.result }}" = success
          test "${{ needs.frontend.result }}" = success
          test "${{ needs.browser.result }}" = success
          test "${{ needs.local-validation-report.result }}" = success
          test "${{ needs.container-validation.result }}" = success
          test "${{ needs.security.result }}" = success
          test "${{ needs.integration.result }}" = success
      - name: Publish workflow summary
        shell: bash
        run: |
          {
            echo '## MDARIX R1 CI/CD validation'
            echo '- Backend tests, migrations, dependency checks, and compose validation: passed'
            echo '- Frontend tests, audit, and production build: passed'
            echo '- Worker and simulator container builds: passed'
            echo '- Production deployment promotion and rollback remain environment-specific gates.'
          } >> "$GITHUB_STEP_SUMMARY"
