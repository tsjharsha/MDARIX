services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mdarix-r1-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - mdarix_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mdarix-outbox-worker:
    build: {context: ., dockerfile: Dockerfile.worker}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MDARIX_OUTBOX_INTERVAL_SECONDS: ${MDARIX_OUTBOX_INTERVAL_SECONDS:-5}
      MDARIX_OUTBOX_BATCH_SIZE: ${MDARIX_OUTBOX_BATCH_SIZE:-50}
      MDARIX_OUTBOX_MAX_ATTEMPTS: ${MDARIX_OUTBOX_MAX_ATTEMPTS:-5}
      MDARIX_OUTBOX_PUBLISHER: ${MDARIX_OUTBOX_PUBLISHER:-noop}
      MDARIX_OUTBOX_ALERT_WEBHOOK: ${MDARIX_OUTBOX_ALERT_WEBHOOK:-}
      MDARIX_OUTBOX_ALERT_TIMEOUT_SECONDS: ${MDARIX_OUTBOX_ALERT_TIMEOUT_SECONDS:-5}
      MDARIX_OUTBOX_HEARTBEAT_FILE: /tmp/mdarix-outbox-heartbeat.json
    healthcheck:
      test: ["CMD", "python", "-c", "import json,time; p='/tmp/mdarix-outbox-heartbeat.json'; d=json.load(open(p)); assert time.time()-__import__('datetime').datetime.fromisoformat(d['updated_at']).timestamp() < 30"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres: {condition: service_healthy}

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mdarix-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-this-local-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - mdarix_object_storage:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8025/api/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 10

  trackwise-simulator-db:
    image: postgres:16
    environment: {POSTGRES_DB: trackwise, POSTGRES_USER: provider, POSTGRES_PASSWORD: provider}
    volumes: [trackwise_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U provider -d trackwise"], interval: 5s, timeout: 5s, retries: 10}
  plm-simulator-db:
    image: postgres:16
    environment: {POSTGRES_DB: plm, POSTGRES_USER: provider, POSTGRES_PASSWORD: provider}
    volumes: [plm_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U provider -d plm"], interval: 5s, timeout: 5s, retries: 10}
  erp-simulator-db:
    image: postgres:16
    environment: {POSTGRES_DB: erp, POSTGRES_USER: provider, POSTGRES_PASSWORD: provider}
    volumes: [erp_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U provider -d erp"], interval: 5s, timeout: 5s, retries: 10}
  supplier-simulator-db:
    image: postgres:16
    environment: {POSTGRES_DB: supplier, POSTGRES_USER: provider, POSTGRES_PASSWORD: provider}
    volumes: [supplier_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U provider -d supplier"], interval: 5s, timeout: 5s, retries: 10}
  trackwise-simulator:
    build: {context: ., dockerfile: source_simulator/Dockerfile}
    environment: {SIMULATOR_PROVIDER: TRACKWISE, SIMULATOR_DATABASE_URL: postgresql+pg8000://provider:provider@trackwise-simulator-db:5432/trackwise}
    depends_on: {trackwise-simulator-db: {condition: service_healthy}}
    ports: ["8101:8099"]
  plm-simulator:
    build: {context: ., dockerfile: source_simulator/Dockerfile}
    environment: {SIMULATOR_PROVIDER: PLM, SIMULATOR_DATABASE_URL: postgresql+pg8000://provider:provider@plm-simulator-db:5432/plm}
    depends_on: {plm-simulator-db: {condition: service_healthy}}
    ports: ["8102:8099"]
  erp-simulator:
    build: {context: ., dockerfile: source_simulator/Dockerfile}
    environment: {SIMULATOR_PROVIDER: ERP, SIMULATOR_DATABASE_URL: postgresql+pg8000://provider:provider@erp-simulator-db:5432/erp}
    depends_on: {erp-simulator-db: {condition: service_healthy}}
    ports: ["8103:8099"]
  supplier-simulator:
    build: {context: ., dockerfile: source_simulator/Dockerfile}
    environment: {SIMULATOR_PROVIDER: SUPPLIER, SIMULATOR_DATABASE_URL: postgresql+pg8000://provider:provider@supplier-simulator-db:5432/supplier}
    depends_on: {supplier-simulator-db: {condition: service_healthy}}
    ports: ["8104:8099"]
  veeva-qms-simulator-db:
    image: postgres:16
    environment: {POSTGRES_DB: veeva_qms, POSTGRES_USER: provider, POSTGRES_PASSWORD: provider}
    volumes: [veeva_qms_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U provider -d veeva_qms"], interval: 5s, timeout: 5s, retries: 10}
  teamcenter-simulator-db:
    image: postgres:16
    environment: {POSTGRES_DB: teamcenter, POSTGRES_USER: provider, POSTGRES_PASSWORD: provider}
    volumes: [teamcenter_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U provider -d teamcenter"], interval: 5s, timeout: 5s, retries: 10}
  oracle-erp-simulator-db:
    image: postgres:16
    environment: {POSTGRES_DB: oracle_erp, POSTGRES_USER: provider, POSTGRES_PASSWORD: provider}
    volumes: [oracle_erp_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U provider -d oracle_erp"], interval: 5s, timeout: 5s, retries: 10}
  coupa-simulator-db:
    image: postgres:16
    environment: {POSTGRES_DB: coupa, POSTGRES_USER: provider, POSTGRES_PASSWORD: provider}
    volumes: [coupa_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U provider -d coupa"], interval: 5s, timeout: 5s, retries: 10}
  veeva-qms-simulator:
    build: {context: ., dockerfile: source_simulator/Dockerfile}
    environment: {SIMULATOR_PROVIDER: VEEVA_QMS, SIMULATOR_DATABASE_URL: postgresql+pg8000://provider:provider@veeva-qms-simulator-db:5432/veeva_qms}
    depends_on: {veeva-qms-simulator-db: {condition: service_healthy}}
    ports: ["8105:8099"]
  teamcenter-simulator:
    build: {context: ., dockerfile: source_simulator/Dockerfile}
    environment: {SIMULATOR_PROVIDER: TEAMCENTER, SIMULATOR_DATABASE_URL: postgresql+pg8000://provider:provider@teamcenter-simulator-db:5432/teamcenter}
    depends_on: {teamcenter-simulator-db: {condition: service_healthy}}
    ports: ["8106:8099"]
  oracle-erp-simulator:
    build: {context: ., dockerfile: source_simulator/Dockerfile}
    environment: {SIMULATOR_PROVIDER: ORACLE_ERP, SIMULATOR_DATABASE_URL: postgresql+pg8000://provider:provider@oracle-erp-simulator-db:5432/oracle_erp}
    depends_on: {oracle-erp-simulator-db: {condition: service_healthy}}
    ports: ["8107:8099"]
  coupa-simulator:
    build: {context: ., dockerfile: source_simulator/Dockerfile}
    environment: {SIMULATOR_PROVIDER: COUPA, SIMULATOR_DATABASE_URL: postgresql+pg8000://provider:provider@coupa-simulator-db:5432/coupa}
    depends_on: {coupa-simulator-db: {condition: service_healthy}}
    ports: ["8108:8099"]

volumes:
  mdarix_postgres_data:
    name: mdarix-r1-postgres-data
  trackwise_data:
  plm_data:
  erp_data:
  supplier_data:
  veeva_qms_data:
  teamcenter_data:
  oracle_erp_data:
  coupa_data:
  mdarix_object_storage:
