<div id="mdarix-design">
<style>
#mdarix-design{--md-bg:light-dark(#f3f6fa,#111c29);--md-panel:light-dark(#fff,#182737);--md-text:light-dark(#183249,#e0edf6);--md-muted:light-dark(#52677a,#acbfce);--md-line:light-dark(#dbe4eb,#354858);--md-teal:light-dark(#087b78,#73d6cb);--md-soft:light-dark(#e8f5f2,#203d40);font:14px/1.5 Inter,Arial,sans-serif;color:var(--md-text);background:var(--md-bg);border:1px solid var(--md-line);border-radius:12px;overflow:hidden;position:relative}
#mdarix-design *{box-sizing:border-box}#mdarix-design button,#mdarix-design select,#mdarix-design input{font:inherit}#mdarix-design button{cursor:pointer}#mdarix-design button:focus-visible,#mdarix-design select:focus-visible,#mdarix-design input:focus-visible{outline:3px solid var(--md-teal);outline-offset:3px}#mdarix-design .md-preview{padding:9px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--md-line);font-size:12px;color:var(--md-muted);flex-wrap:wrap}#mdarix-design select{color:var(--md-text);background:var(--md-panel);border:1px solid var(--md-line);padding:6px 10px;border-radius:6px}#mdarix-design .md-top{background:var(--md-panel);display:flex;justify-content:space-between;align-items:center;gap:20px;padding:17px 22px;border-bottom:1px solid var(--md-line)}#mdarix-design .md-logo{font-size:23px;font-weight:800;letter-spacing:-1px}#mdarix-design .md-logo span{color:var(--md-teal)}#mdarix-design .md-brand{display:flex;gap:20px;align-items:center}#mdarix-design .md-caption{font-size:12px;color:var(--md-muted)}#mdarix-design .md-person{display:flex;align-items:center;gap:10px;font-size:12px}#mdarix-design .md-avatar{display:grid;place-items:center;background:var(--md-soft);color:var(--md-teal);width:34px;height:34px;border-radius:50%;font-weight:700}#mdarix-design .md-layout{display:grid;grid-template-columns:190px minmax(0,1fr);min-height:700px}#mdarix-design .md-side{background:var(--md-panel);border-right:1px solid var(--md-line);padding:20px 12px}#mdarix-design .md-label{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;font-weight:700;color:var(--md-muted);margin:8px 12px 12px}#mdarix-design .md-nav{width:100%;text-align:left;display:flex;align-items:center;gap:10px;padding:11px 12px;border:0;background:none;border-radius:7px;color:var(--md-muted);margin:3px 0;font-size:13px}#mdarix-design .md-nav[aria-current=page]{background:var(--md-soft);color:var(--md-teal);font-weight:700;box-shadow:inset 3px 0 var(--md-teal)}#mdarix-design .md-nav svg{width:16px;height:16px;flex-shrink:0}#mdarix-design main{padding:24px;min-width:0}#mdarix-design h1{font-size:26px;line-height:1.2;letter-spacing:-.7px;margin:4px 0 8px;font-weight:650}#mdarix-design h2{font-size:15px;margin:0 0 6px;font-weight:650}#mdarix-design h3{font-size:14px;margin:0 0 5px}#mdarix-design p{margin:0 0 12px}#mdarix-design .md-muted{color:var(--md-muted);font-size:12px}#mdarix-design .md-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}#mdarix-design .md-button{border:1px solid var(--md-line);background:var(--md-panel);color:var(--md-text);padding:9px 13px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap}#mdarix-design .md-primary{background:var(--md-teal);color:light-dark(#fff,#082724);border-color:var(--md-teal)}#mdarix-design .md-panel{background:var(--md-panel);border:1px solid var(--md-line);border-radius:9px;padding:18px;margin-bottom:16px}#mdarix-design .md-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(200px,1fr);gap:16px}#mdarix-design .md-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}#mdarix-design .md-stat{background:var(--md-panel);border:1px solid var(--md-line);border-radius:8px;padding:16px}#mdarix-design .md-number{font-size:28px;letter-spacing:-1px;font-weight:650;margin:7px 0}#mdarix-design .md-badge{display:inline-block;padding:3px 7px;border-radius:5px;background:var(--md-soft);color:var(--md-teal);font-size:11px;font-weight:600}#mdarix-design .md-warn{background:light-dark(#fff2d8,#453720);color:light-dark(#895500,#f6cf7d)}#mdarix-design .md-blue{background:light-dark(#edf2ff,#253453);color:light-dark(#3b56a0,#bbcdff)}#mdarix-design .md-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid var(--md-line)}#mdarix-design .md-row:first-of-type{margin-top:14px}#mdarix-design .md-link{background:none;border:0;padding:0;color:var(--md-teal);text-align:left;font-weight:600;font-size:13px}#mdarix-design .md-context{background:var(--md-panel);padding:12px 15px;border:1px solid var(--md-line);border-radius:7px;margin-bottom:18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;font-size:12px}#mdarix-design .md-tabs{display:flex;gap:20px;border-bottom:1px solid var(--md-line);margin:0 0 20px;overflow:auto}#mdarix-design .md-tabs button{border:0;border-bottom:2px solid transparent;padding:10px 0;background:none;color:var(--md-muted);white-space:nowrap;font-size:12px}#mdarix-design .md-tabs button[aria-pressed=true]{border-bottom-color:var(--md-teal);color:var(--md-teal);font-weight:700}#mdarix-design .md-note{border-left:3px solid var(--md-teal);background:var(--md-soft);padding:13px;border-radius:0 6px 6px 0;font-size:12px;margin:12px 0}#mdarix-design .md-step{display:flex;gap:12px;padding:10px 0}#mdarix-design .md-dot{width:10px;height:10px;background:var(--md-teal);border-radius:50%;margin-top:6px;flex-shrink:0}#mdarix-design table{border-collapse:collapse;width:100%;font-size:12px}#mdarix-design th{text-align:left;color:var(--md-muted);font-weight:500;padding:10px 8px;background:var(--md-bg)}#mdarix-design td{padding:14px 8px;border-bottom:1px solid var(--md-line)}#mdarix-design .md-tablewrap{overflow:auto}#mdarix-design .md-mini-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}#mdarix-design .md-tile{padding:15px;border:1px solid var(--md-line);border-radius:7px}#mdarix-design .md-bar{height:7px;background:var(--md-bg);border-radius:4px;margin-top:9px;overflow:hidden}#mdarix-design .md-bar span{display:block;height:100%;background:var(--md-teal)}#mdarix-design dialog{max-width:480px;width:calc(100% - 32px);border:1px solid var(--md-line);border-radius:10px;padding:24px;background:var(--md-panel);color:var(--md-text)}#mdarix-design dialog::backdrop{background:#0b223c88}#mdarix-design .md-footer{padding:12px 20px;border-top:1px solid var(--md-line);font-size:11px;color:var(--md-muted);background:var(--md-panel)}
@media(max-width:760px){#mdarix-design .md-layout{grid-template-columns:1fr}#mdarix-design .md-side{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--md-line);padding:8px}#mdarix-design .md-side .md-label{display:none}#mdarix-design .md-nav{width:auto;white-space:nowrap}#mdarix-design .md-grid{grid-template-columns:1fr}#mdarix-design .md-caption{display:none}#mdarix-design main{padding:18px}#mdarix-design .md-top{padding:14px}#mdarix-design .md-heading{align-items:flex-start}#mdarix-design h1{font-size:23px}}@media(max-width:430px){#mdarix-design .md-stats{grid-template-columns:1fr}#mdarix-design .md-mini-grid{grid-template-columns:1fr}#mdarix-design .md-heading{flex-direction:column}#mdarix-design .md-person{font-size:11px}}
</style>
<div class="md-preview"><span>DESIGN PREVIEW · All records and metrics are illustrative</span><label>Preview workspace <select id="md-role"><option value="quality">Quality investigator</option><option value="platform">Platform administrator</option><option value="customer">Customer administrator</option></select></label></div>
<header class="md-top"><div class="md-brand"><div class="md-logo">MDAR<span>IX</span></div><div class="md-caption" id="md-workspace">Product & investigation intelligence</div></div><div class="md-person"><span class="md-avatar">ST</span><div>Srinivas Telikicherla<br><span class="md-muted" id="md-role-name">Quality investigator · AcmeCare demo</span></div></div></header>
<div class="md-layout"><nav class="md-side" id="md-nav" aria-label="Workspace navigation"></nav><main id="md-content"></main></div><div class="md-footer">Evidence before inference. Authorized humans decide. <span id="md-status" aria-live="polite"></span></div>
<dialog id="md-detail"><div class="md-heading"><h2 id="md-detail-title">Evidence detail</h2><button class="md-button" id="md-close">Close</button></div><div id="md-detail-body"></div></dialog>
<script>
(()=>{const root=document.getElementById('mdarix-design'),nav=root.querySelector('#md-nav'),content=root.querySelector('#md-content'),dialog=root.querySelector('#md-detail');let workspace='quality',page='home',tab='Summary';
const menus={quality:[['home','My workspace','layout-dashboard'],['products','Product 360','box'],['investigations','Investigations','search'],['evidence','Evidence library','files'],['decision','Decision Center','clipboard-check']],platform:[['platform','Platform overview','layout-dashboard'],['customers','Customers & tenants','building-2'],['licenses','Plans & licensing','badge-check'],['access','Identity & access','users'],['mapping','Data & configuration','database'],['integrations','Integrations','plug'],['ai','AI Control Center','sparkles'],['security','Security','shield'],['operations','Operations','activity']],customer:[['customer','Tenant overview','layout-dashboard'],['users','Users & roles','users'],['permissions','Permissions','shield'],['tenantmapping','Tenant mappings','database'],['tenantintegrations','Integrations','plug'],['subscription','Subscription & usage','badge-check']]};
const button=(label,action,primary=false)=>`<button class="md-button ${primary?'md-primary':''}" data-action="${action}">${label}</button>`;
const badge=(label,kind='')=>`<span class="md-badge ${kind}">${label}</span>`;
const head=(eyebrow,title,sub,action='')=>`<div class="md-heading"><div><div class="md-muted">${eyebrow}</div><h1>${title}</h1><div class="md-muted">${sub}</div></div>${action}</div>`;
const context=()=>`<div class="md-context"><strong>AcmeCare demo</strong><span>Nimbus infusion pump · Rev D</span><span>INV-024</span>${badge('Current view')}</div>`;
const stats=(items)=>`<div class="md-stats">${items.map(([label,note,sub])=>`<div class="md-stat"><div class="md-muted">${label}</div><div class="md-number">${note}</div><div class="md-muted">${sub}</div></div>`).join('')}</div>`;
const row=(title,sub,action='investigations',tag='Open')=>`<div class="md-row"><div><button class="md-link" data-page="${action}">${title}</button><div class="md-muted">${sub}</div></div>${badge(tag,tag==='Needs review'?'md-warn':'')}</div>`;
const evidence=()=>`<div class="md-tablewrap"><table><thead><tr><th>Evidence / source</th><th>Relationship</th><th>Review</th></tr></thead><tbody><tr><td><button class="md-link" data-action="evidence">EV-041 · Complaint trend export</button><br><span class="md-muted">QMS · Revision 2 · 24 Sep 2026</span></td><td>Supports investigation</td><td>${badge('Reviewed')}</td></tr><tr><td><button class="md-link" data-action="supplier">EV-042 · Supplier test report</button><br><span class="md-muted">Supplier · Revision 1 · 23 Sep 2026</span></td><td>Conflicting observation</td><td>${badge('Needs review','md-warn')}</td></tr><tr><td><button class="md-link" data-action="change">EV-043 · Engineering change</button><br><span class="md-muted">PLM · Revision D · 18 Sep 2026</span></td><td>Context only</td><td>${badge('Reviewed')}</td></tr></tbody></table></div>`;
function home(){return head('QUALITY WORKSPACE','Your next decisions, in focus','Saturday, 26 September · AcmeCare demonstration tenant',button('Open investigation','open',true))+stats([['Assigned investigations','6','2 awaiting your review'],['Evidence requests','3','1 overdue supplier response'],['Decisions to review','2','Independent reviewer required']])+`<div class="md-grid"><section class="md-panel"><h2>Continue your work</h2><p class="md-muted">Prioritized by your assigned actions.</p>${row('INV-024 · Intermittent flow interruption','Nimbus infusion pump · Rev D · Due 28 Sep','investigations','Needs review')}${row('INV-021 · Packaging seal variation','Sterile tubing set · Rev B · Due 30 Sep')}${row('DEC-008 · Investigation review','Nimbus infusion pump · Evidence package ready','decision','Ready')}</section><section class="md-panel"><h2>Requires attention</h2><div class="md-step"><span class="md-dot"></span><div><strong>Resolve conflicting evidence</strong><p class="md-muted">Supplier test results differ from field observations in INV-024.</p><button class="md-link" data-action="supplier">Review EV-042 →</button></div></div><div class="md-step"><span class="md-dot"></span><div><strong>Complete reviewer assignment</strong><p class="md-muted">An independent approver is needed for DEC-008.</p><button class="md-link" data-page="decision">Open decision →</button></div></div></section></div><section class="md-panel"><h2>Products in your workspace</h2>${row('Nimbus infusion pump','Rev D · 4 open investigations · Last sync 09:42','products','Connected')}${row('Sterile tubing set','Rev B · 2 open investigations · Last sync 09:38','products','Connected')}</section>`}
function products(){return head('PRODUCT 360','Nimbus infusion pump','NIM-100 · Active product · Product owner: Quality Engineering',button('Open investigation','open',true))+context()+stats([['Product revision','Rev D','Effective 18 Sep 2026'],['Open investigations','4','Across 2 manufacturing lots'],['Connected evidence','18','QMS · PLM · Supplier']])+`<div class="md-grid"><section class="md-panel"><h2>Connected product context</h2>${row('4 complaints linked to INV-024','Reported after the revision change','investigations','Review')}${row('CHG-018 · Flow sensor update','Approved change · Applicable to Rev D','evidence','Context')}${row('LOT-209 · Assembly batch','Supplier report requires reconciliation','evidence','Needs review')}</section><section class="md-panel"><h2>Product timeline</h2><div class="md-step"><span class="md-dot"></span><div>24 Sep · Complaint export received<p class="md-muted">Known to MDARIX on 25 Sep</p></div></div><div class="md-step"><span class="md-dot"></span><div>23 Sep · Supplier test completed<p class="md-muted">Conflicting observation retained</p></div></div><div class="md-step"><span class="md-dot"></span><div>18 Sep · Rev D effective<p class="md-muted">CHG-018 · PLM reference</p></div></div></section></div>`}
function investigations(){let tabs=['Summary','Evidence','Hypotheses','Timeline'];return head('INVESTIGATIONS / INV-024','Intermittent flow interruption','Assigned to Srinivas Telikicherla · Due 28 September',button('Prepare decision','decision',true))+context()+`<div class="md-tabs">${tabs.map(t=>`<button data-tab="${t}" aria-pressed="${tab===t}">${t}</button>`).join('')}</div>`+(tab==='Evidence'?`<section class="md-panel"><h2>Evidence connected to this investigation</h2>${evidence()}</section>`:tab==='Hypotheses'?`<section class="md-panel"><h2>Competing explanations</h2><div class="md-note">AI-assisted suggestions · Human review required · Causality not established</div>${row('H-01 · Revision-related behavior','Supported by timing; supplier test is contradictory','evidence','Unresolved')}${row('H-02 · Lot-specific variation','Lot comparison data is missing','evidence','Unresolved')}<p class="md-muted">Neither explanation is an established root cause.</p></section>`:tab==='Timeline'?`<section class="md-panel"><h2>Event and knowledge timeline</h2>${row('18 Sep · Revision becomes effective','PLM record received 19 Sep','evidence','Event')}${row('23 Sep · Supplier test completed','Report received 25 Sep','evidence','Event')}${row('24 Sep · Complaint trend exported','Available to the investigation on 25 Sep','evidence','Event')}</section>`:`<div class="md-grid"><section><div class="md-panel"><h2>Investigation question</h2><p>What evidence explains the reported flow interruptions, and what additional checks are needed before a product decision?</p><div class="md-note"><strong>Current assessment</strong><br>The reports share a product revision, but available evidence does not establish a causal link. A supplier test presents a conflicting observation.</div><h3>Evidence to review</h3>${row('EV-041 · Complaint trend export','4 linked reports · Source preserved','evidence','Reviewed')}${row('EV-042 · Supplier test report','Conflicts with field observations','evidence','Needs review')}</div></section><section><div class="md-panel"><h2>Review readiness</h2><div class="md-row"><span>Source references</span>${badge('Available')}</div><div class="md-row"><span>Contradiction review</span>${badge('Pending','md-warn')}</div><div class="md-row"><span>Lot comparison</span>${badge('Missing','md-warn')}</div><div class="md-row"><span>Human decision</span>${badge('Not recorded','md-blue')}</div></div><div class="md-panel"><h2>Suggested next step</h2><p class="md-muted">Request comparison results for LOT-208 and LOT-209.</p>${button('Inspect suggestion','suggestion')}</div></section></div>`)}
function decision(){return head('DECISION CENTER / DEC-008','Investigation review','Review the evidence package before recording a decision.',button('Review requirements','signature',true))+context()+`<div class="md-grid"><section class="md-panel"><h2>Proposed next action</h2><p>Obtain lot-comparison evidence before concluding the investigation.</p><h3>Rationale</h3><p class="md-muted">Available complaint observations and supplier results are inconsistent. Further evidence is needed to evaluate the competing explanations.</p><h3>Evidence package</h3>${evidence()}</section><section class="md-panel"><h2>Approval requirements</h2><div class="md-row"><span>Independent reviewer</span>${badge('Required','md-warn')}</div><div class="md-row"><span>Decision and remarks</span>${badge('Required','md-blue')}</div><div class="md-row"><span>Reauthentication</span>${badge('At signing')}</div><div class="md-note">No approval is recorded in this design preview.</div><p class="md-muted">Version changes require a fresh review. The backend must verify authority and subscription access.</p></section></div>`}
function platform(){return head('ADMINISTRATOR CONTROL PLANE','Platform overview','Manage customer access, configuration, integrations, and operations.',button('Provision customer','provision',true))+stats([['Active customers','12','Across 14 tenants'],['Subscriptions expiring','2','Within the next 30 days'],['Integrations requiring review','1','Schema change detected']])+`<div class="md-grid"><section class="md-panel"><h2>One control plane across the product</h2><p class="md-muted">A focused view of customer operations.</p><div class="md-mini-grid">${[['Customers & tenants','12 active · 1 onboarding','customers'],['Plans & licensing','2 renewals require action','licenses'],['Data & configuration','1 mapping change to review','mapping'],['AI Control Center','Latest evaluation: not run','ai']].map(([a,b,c])=>`<div class="md-tile"><button class="md-link" data-page="${c}">${a} →</button><div class="md-muted">${b}</div></div>`).join('')}</div><h2 style="margin-top:20px">Customer onboarding stages</h2>${[['Invited',2],['Configuration',1],['Validation',1],['Active',12]].map(([a,n])=>`<div class="md-row"><span>${a}</span><strong>${n}</strong></div>`).join('')}</section><section class="md-panel"><h2>Requires attention</h2>${row('Renewal due · AcmeCare','Subscription ends 12 Oct','licenses','Review')}${row('Schema change · QMS source','2 fields need mapping review','mapping','Review')}<div class="md-note">Customer records and operational counts shown here are synthetic.</div></section></div>`}
function customer(){return head('CUSTOMER ADMINISTRATION','AcmeCare tenant overview','Manage your team within your subscribed capabilities.')+stats([['Licensed users','18 / 25','7 seats available'],['Customer administrators','2 / 2','Plan limit reached'],['Enabled integrations','2 / 3','1 integration slot available']])+`<div class="md-grid"><section class="md-panel"><h2>Team & access</h2>${row('Users and roles','Invite users and assign tenant-scoped roles','users','Manage')}${row('Object and field permissions','Control visibility, editability and approval authority','permissions','Manage')}</section><section class="md-panel"><h2>Subscription boundary</h2><p>Available capabilities are determined by your plan.</p><p class="md-muted">Roles can restrict entitled capabilities. They cannot enable features outside the subscription.</p><button class="md-link" data-page="subscription">View subscription →</button></section></div>`}
function detailPage(){let name=menus[workspace].find(x=>x[0]===page)?.[1]||'Workspace';let mapping=['mapping','tenantmapping'].includes(page);return head(workspace==='platform'?'ADMINISTRATOR CONTROL PLANE':'CUSTOMER ADMINISTRATION',name,mapping?'Review versions and impact before activating a mapping.':'Preview of the workspace detail pattern.')+`<section class="md-panel"><h2>${mapping?'QMS complaint mapping':name==='Customers & tenants'?'Customer directory':'Configuration overview'}</h2>${mapping?`<div class="md-note">Master v3 is available. AcmeCare remains pinned to v2 until an authorized upgrade is approved.</div><div class="md-tablewrap"><table><thead><tr><th>Source field</th><th>Canonical field</th><th>Policy</th></tr></thead><tbody><tr><td>complaint_number</td><td>complaint_identifier</td><td>Tenant override allowed</td></tr><tr><td>device_revision</td><td>product_version_id</td><td>Reference lookup</td></tr><tr><td>tenant_id</td><td>tenant_id</td><td>Server managed</td></tr></tbody></table></div><div style="margin-top:18px">${button('Review version impact','mapping',true)}</div>`:page==='customers'?`${row('AcmeCare Instruments','TEN-001 · Customer Admin active · Enterprise demo','platform','Active')}${row('Northstar Devices','TEN-002 · Invitation accepted · Configuration pending','platform','Onboarding')}`:`<p class="md-muted">This section uses the same list, detail, status and action pattern. Its production controls must reflect the authenticated user’s server-authorized permissions.</p><div class="md-note">${page==='ai'?'Evaluation status: NOT RUN. Never substitute a simulated PASS.':page==='licenses'||page==='subscription'?'AcmeCare · 25 licensed users · Renewal due 12 October 2026.':page==='users'?'18 active users. Invitations and assignments are confined to AcmeCare.':'Configuration details shown only when available from the relevant service.'}</div>${button('Inspect design requirements','requirements')}`}</section>`}
function render(){nav.innerHTML='<div class="md-label">'+(workspace==='platform'?'Control plane':workspace==='customer'?'Tenant administration':'Workspace')+'</div>'+menus[workspace].map(([id,label,icon])=>`<button class="md-nav" data-page="${id}" ${page===id?'aria-current="page"':''}><i data-lucide="${icon}" aria-hidden="true"></i>${label}</button>`).join('');content.innerHTML=page==='home'?home():page==='products'?products():page==='investigations'?investigations():page==='evidence'?head('EVIDENCE LIBRARY','Trace every observation','Source records, review state, and applicability in one place.')+context()+`<section class="md-panel">${evidence()}</section>`:page==='decision'?decision():page==='platform'?platform():page==='customer'?customer():detailPage();if(typeof lucide!=='undefined')lucide.createIcons({attrs:{width:16,height:16}})}
function show(title,body){root.querySelector('#md-detail-title').textContent=title;root.querySelector('#md-detail-body').innerHTML=body;dialog.showModal()}
root.addEventListener('click',e=>{const target=e.target.closest('button');if(!target)return;if(target.dataset.page){page=target.dataset.page;tab='Summary';render();return}if(target.dataset.tab){tab=target.dataset.tab;render();return}const a=target.dataset.action;if(a==='open'||a==='decision'){page=a==='open'?'investigations':'decision';render();return}if(a==='evidence'||a==='supplier'||a==='change'){show(a==='supplier'?'EV-042 · Supplier test report':a==='change'?'EV-043 · Engineering change':'EV-041 · Complaint trend export',`<div class="md-muted">Synthetic source preview · INV-024</div><div class="md-note">${a==='supplier'?'The supplier reports no interruption under its test conditions. Field reports describe intermittent interruption. Differences in test conditions remain unresolved.':a==='change'?'The flow sensor revision became effective on 18 September. Temporal association alone does not establish causality.':'Four complaint records describe intermittent flow interruption for the selected product revision.'}</div><p>Applicable product: Nimbus infusion pump, Rev D.</p><p class="md-muted">Production implementation: show source anchor, original document, event date, received date, version, reviewer and permitted download.</p>`)}else if(a==='signature')show('Controlled decision review','<p>In the application, the server checks approval authority, segregation of duties, current version and plan access.</p><div class="md-note">Then show the read-only user identity, mandatory Approve / Reject choice, remarks, and secure reauthentication.</div><p class="md-muted">This preview does not collect passwords or create signatures.</p>');else if(a==='mapping')show('Mapping version impact','<p>Candidate master: v3 · Current tenant mapping: v2.</p><div class="md-note">2 changed fields · Tenant overrides preserved · Dry run required</div><p>Review affected records, validation errors and conflicts before an authorized activation. Existing tenant mappings do not update automatically.</p>');else if(a==='provision')show('Provision customer','<p>Company → Tenant and region → Plan and limits → Initial Customer Administrator → Review and provision.</p><div class="md-note">Only the MDARIX Platform Administrator provisions customers. Customer Administrators manage their own tenant’s team.</div>');else if(a==='suggestion')show('Suggested evidence request','<p>Request lot-comparison results and comparable operating conditions for LOT-208 and LOT-209.</p><div class="md-note">AI suggestion only. A human reviews the scope and recipient before any message is sent.</div>');else if(a==='requirements')show('Implementation requirements','<p>Load real authorized data, show loading / empty / error / denied states, preserve record context, and provide audit-backed actions.</p><div class="md-note">Additional sections are specified in the Codex implementation brief.</div>')});root.querySelector('#md-close').onclick=()=>dialog.close();root.querySelector('#md-role').onchange=e=>{workspace=e.target.value;page=menus[workspace][0][0];root.querySelector('#md-workspace').textContent=workspace==='platform'?'Administrator Control Plane':workspace==='customer'?'Customer Administration':'Product & investigation intelligence';root.querySelector('#md-role-name').textContent=workspace==='platform'?'Platform Administrator · MDARIX':workspace==='customer'?'Customer Administrator · AcmeCare demo':'Quality investigator · AcmeCare demo';render()};render();})();
