<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MDARIX · Post-market surveillance and complaint handling for medical devices</title>
    <meta
      name="description"
      content="Medical device complaint handling, FDA and EU MDR reporting clocks, trend signals, investigations and CAPA in one traceable place. Free 30-day trial."
    />
    <!-- Link previews (LinkedIn, email, chat) read these. Each website page has its own title, description, canonical
         and og:url in its pre-rendered copy of this file (scripts/prerender.mjs, from src/site/seo.ts), and the browser
         keeps them up to date. This file itself is the application shell, served for every other address. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MDARIX" />
    <meta property="og:title" content="MDARIX · Post-market surveillance and complaint handling for medical devices" />
    <meta
      property="og:description"
      content="Medical device complaint handling, FDA and EU MDR reporting clocks, trend signals, investigations and CAPA in one traceable place. Free 30-day trial."
    />
    <meta property="og:image" content="https://mdarix.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="MDARIX: post-market surveillance and complaint handling for medical device teams"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://mdarix.com/#organization",
            "name": "MDARIX",
            "url": "https://mdarix.com/",
            "logo": "https://mdarix.com/logo.png",
            "description": "Post-market surveillance and complaint handling software for medical device makers."
          },
          {
            "@type": "WebSite",
            "@id": "https://mdarix.com/#website",
            "name": "MDARIX",
            "url": "https://mdarix.com/",
            "publisher": {
              "@id": "https://mdarix.com/#organization"
            },
            "inLanguage": "en"
          }
        ]
      }
    </script>
    <meta name="theme-color" content="#183249" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Without JavaScript the pre-rendered pages show their animated parts complete (public/noscript.css). -->
    <noscript><link rel="stylesheet" href="/noscript.css" /></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
