# Reviewed exceptions for the image scans (ci.yml "Production image scan", release.yml). Each HIGH or CRITICAL finding
# listed here has no fix in the base image's distribution yet and was reviewed as not reachable in MDARIX's containers.
# Every other finding, fixed or not, fails the scan.
#
# Review facts the statements rely on (docker-compose.prod.yml, Dockerfile.api): the API, worker, scheduler and migrate
# containers run as the non-root user "mdarix" on a read-only root filesystem, with no-new-privileges and every Linux
# capability dropped, so a setuid program cannot raise privileges; nobody logs in to them; MDARIX stores its data in
# PostgreSQL and never opens a SQLite file; its only subprocess is an operator-configured malware scanner command.
#
# An entry stops applying on its expired_at date: the scan then fails until the finding is reviewed again (renew the
# date with a fresh statement, or remove the entry once the base image ships a fix). Reviewed 2026-10-08 against
# python:3.13-slim-bookworm (Debian 12.15).

vulnerabilities:
  - id: CVE-2023-45853
    statement: >-
      zlib MiniZip (zipOpenNewFileInZip4_64). MiniZip is not part of the zlib library Python links; MDARIX never builds
      zip files with MiniZip (exports use Python's zipfile). Debian: will not fix.
    expired_at: 2027-01-06
  - id: CVE-2025-7458
    statement: >-
      SQLite integer overflow needing an attacker who can run arbitrary SQL in SQLite. MDARIX uses PostgreSQL and runs
      no SQLite statements from user input.
    expired_at: 2027-01-06
  - id: CVE-2026-11822
    statement: >-
      SQLite FTS5 memory corruption from a crafted database file. MDARIX never opens SQLite databases, uploaded or
      otherwise. Debian: fix deferred.
    expired_at: 2027-01-06
  - id: CVE-2026-11824
    statement: >-
      SQLite FTS5 heap overflow from a crafted database file. MDARIX never opens SQLite databases, uploaded or
      otherwise. Debian: fix deferred.
    expired_at: 2027-01-06
  - id: CVE-2025-69720
    statement: >-
      Stack overflow in the ncurses infocmp command-line tool. The tool is never run in MDARIX's containers.
    expired_at: 2027-01-06
  - id: CVE-2026-16742
    statement: >-
      systemd-homed local privilege escalation. The containers run no systemd and no homed-managed users; only the
      client libraries are installed. Debian: fix deferred.
    expired_at: 2027-01-06
  - id: CVE-2026-41992
    statement: >-
      GNU gzip program LZH decompression. MDARIX never runs the gzip program (Python's gzip module uses zlib), and
      decompresses nothing users upload. Debian: fix deferred.
    expired_at: 2027-01-06
  - id: CVE-2026-53613
    statement: >-
      util-linux mount(8) TOCTOU for user fstab entries, a local privilege escalation through setuid mount. No local
      users, no user fstab entries, and no-new-privileges stops setuid escalation.
    expired_at: 2027-01-06
  - id: CVE-2026-76642
    statement: >-
      util-linux mount post-hooks after a failed helper, local privilege escalation through setuid mount. No local
      users, and no-new-privileges stops setuid escalation.
    expired_at: 2027-01-06
  - id: CVE-2026-78408
    statement: >-
      util-linux nsenter --join-cgroup authority leak. nsenter is never run in MDARIX's containers, which have every
      capability dropped.
    expired_at: 2027-01-06
  - id: CVE-2026-78409
    statement: >-
      util-linux X-mount.subdir symlink escape (Linux 6.15+ mounts). MDARIX's containers mount nothing; no-new-privileges
      stops setuid mount.
    expired_at: 2027-01-06
  - id: CVE-2026-78410
    statement: >-
      util-linux restricted bind mount source redirection through setuid mount. No local users and no fstab entries;
      no-new-privileges stops setuid escalation.
    expired_at: 2027-01-06
  - id: CVE-2026-54369
    statement: >-
      libacl symlink traversal in pathname-based ACL functions used by a privileged process. MDARIX sets no ACLs and runs
      no privileged process that does. Debian: fix deferred.
    expired_at: 2027-01-06
  - id: CVE-2026-84782
    statement: >-
      OpenSSL DTLS handshake retransmission. MDARIX uses TLS over TCP only (PostgreSQL, SMTP, HTTPS to providers), never
      DTLS.
    expired_at: 2027-01-06
  - id: CVE-2026-9538
    statement: >-
      Perl Archive::Tar memory exhaustion from a crafted tar header. MDARIX runs no Perl and reads no tar files. Debian:
      fix deferred.
    expired_at: 2027-01-06
  - id: CVE-2026-88647
    statement: >-
      GnuTLS hostname-verification information disclosure with no Debian-fixed version available. The MDARIX API does
      not call GnuTLS: Python HTTPS uses OpenSSL and PostgreSQL connections use libpq/OpenSSL. Reassess when Debian
      publishes a fixed libgnutls30 package.
    expired_at: 2027-01-06
  - id: CVE-2026-53615
    statement: >-
      util-linux DOS partition-table parser (bsdutils, libblkid1, libmount1, libsmartcols1, libuuid1, mount,
      util-linux, util-linux-extra) with no Debian-fixed version available. MDARIX's containers never probe or mount
      disks or partitions, nobody logs in to them, and they run as a non-root user with no-new-privileges and every
      capability dropped. Reviewed 14 Nov 2026 (owner sign-off); reassess when Debian publishes a fix.
    expired_at: 2027-01-06
  - id: CVE-2026-119373
    statement: >-
      SQLite FTS5 flaw (libsqlite3-0) with no Debian-fixed version available. MDARIX stores its data in PostgreSQL and
      never opens a SQLite database, uploaded or otherwise. Reviewed 14 Nov 2026 (owner sign-off).
    expired_at: 2027-01-06
  - id: CVE-2026-119374
    statement: >-
      SQLite FTS5 flaw (libsqlite3-0) with no Debian-fixed version available. MDARIX stores its data in PostgreSQL and
      never opens a SQLite database, uploaded or otherwise. Reviewed 14 Nov 2026 (owner sign-off).
    expired_at: 2027-01-06
  - id: CVE-2026-119379
    statement: >-
      SQLite session-changeset flaw (libsqlite3-0) with no Debian-fixed version available. MDARIX never opens a SQLite
      database and never applies SQLite changesets. Reviewed 14 Nov 2026 (owner sign-off).
    expired_at: 2027-01-06
  - id: CVE-2026-76844
    statement: >-
      zlib gzwrite flaw (zlib1g) with no Debian-fixed version available. MDARIX does not call zlib's gz* file
      functions: Python's gzip and zipfile modules use zlib's deflate/inflate stream objects. Reviewed 14 Nov 2026
      (owner sign-off); reassess when Debian publishes a fix.
    expired_at: 2027-01-06
  - id: CVE-2026-85091
    statement: >-
      zlib gz_vacate flaw (zlib1g) with no Debian-fixed version available. MDARIX does not call zlib's gz* file
      functions: Python's gzip and zipfile modules use zlib's deflate/inflate stream objects. Reviewed 14 Nov 2026
      (owner sign-off); reassess when Debian publishes a fix.
    expired_at: 2027-01-06
  - id: CVE-2026-116587
    statement: >-
      go-jose v3 (v3.0.5) inside the Caddy binary of mdarix/web, denial of service from crafted RSA parameters in a
      JWK, with no fixed v3 release. v3 reaches Caddy only through its internal certificate-authority module (caddypki,
      smallstep); MDARIX's Caddyfile configures no internal CA, ACME server or PKI app and obtains its certificate from a
      public ACME CA, so no JWK is parsed by that module. go-jose v4 is already raised to the fixed 4.1.6. Reviewed 14 Nov
      2026 (owner sign-off); remove once Caddy no longer pulls go-jose v3 or a fixed v3 ships.
    expired_at: 2027-01-06
  - id: CVE-2026-88648
    statement: >-
      GnuTLS cross-domain certificate-restriction bypass with no Debian-fixed version available. The MDARIX API does
      not call GnuTLS: Python HTTPS uses OpenSSL and PostgreSQL connections use libpq/OpenSSL. Reassess when Debian
      publishes a fixed libgnutls30 package.
    expired_at: 2027-01-06
  - id: CVE-2025-6020
    statement: >-
      Linux-PAM pam_namespace path traversal leading to local privilege escalation, in the libpam packages of the
      Debian base image, with no Debian-fixed version. It needs a local login session that runs pam_namespace;
      nobody logs in to MDARIX's containers, no PAM service is configured or started in them, and they run as the
      non-root user with no-new-privileges and all capabilities dropped. Reviewed 17 Nov 2026 (owner sign-off);
      remove once Debian ships a fixed libpam.
    expired_at: 2027-01-06
