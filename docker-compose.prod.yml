# MDARIX production stack for one Linux VM (docs/runbooks/DEPLOYMENT.md).
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production pull
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --no-build --wait
#
# (Or export COMPOSE_FILE=docker-compose.prod.yml and COMPOSE_ENV_FILES=.env.production in the deploy user's profile
# and type plain "docker compose ...".) The --env-file matters: the ${...:?} values in this file are read from it,
# never from the env_file entries below, so without it a fresh VM stops with "required variable ... is missing".
#
# Postgres is not in this file: a managed service, or during the validation phase the server's own (layer
# docker-compose.staging-oracle.yml; docs/runbooks/GCP_DEPLOYMENT.md). Only Caddy is reachable from the
# internet (80/443); the API, the background service (outbox worker and scheduler) and the virus scanner talk on a
# private network. No simulators, no mail
# catcher, no published database ports, and no default passwords. Settings live in two files:
#   .env.production  every long-running service (api, background); no owner or backup database secrets.
#   .env.migrate     the database owner's password, dedicated-plane owner URLs, the backup login and the off-site
#                    bucket keys; loaded only by the one-shot migrate and backup jobs. The API and the background service
#                    refuse to start if any of these reaches them (backend/app/config_check.py).

name: mdarix

x-logging: &logging
  # Docker keeps at most 10 x 20 MB of JSON logs per container. To ship logs to the host journal instead, set
  # "log-driver": "journald" in /etc/docker/daemon.json and remove these blocks (DEPLOYMENT.md, section 6).
  driver: json-file
  options: {max-size: "20m", max-file: "10"}

# The managed database's CA bundle (when it is not signed by a public CA): files in MDARIX_DB_CA_DIR on the host are
# readable at /etc/mdarix/certs, e.g. POSTGRES_SSLROOTCERT=/etc/mdarix/certs/db-ca.pem.
x-db-ca: &db-ca ${MDARIX_DB_CA_DIR:-./certs}:/etc/mdarix/certs:ro

x-app: &app
  image: ${MDARIX_IMAGE_REPOSITORY:-mdarix}/api:${MDARIX_RELEASE:-latest}
  build:
    context: .
    dockerfile: Dockerfile.api
  env_file: .env.production
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=256m
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  networks: [internal]
  logging: *logging

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: ${MDARIX_IMAGE_REPOSITORY:-mdarix}/web:${MDARIX_RELEASE:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    # Caddy needs no application settings, so it does not get .env.production: only its domain and ACME email, who may
    # open the site (public, or private behind a login on a private staging server), the optional www redirect and the
    # other host names it redirects to the domain (infrastructure/docker/Caddyfile).
    environment:
      MDARIX_DOMAIN: ${MDARIX_DOMAIN:?set MDARIX_DOMAIN in .env.production and pass --env-file .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env.production and pass --env-file .env.production}
      MDARIX_SITE_ACCESS: ${MDARIX_SITE_ACCESS:-public}
      MDARIX_SITE_LOGIN_USER: ${MDARIX_SITE_LOGIN_USER:-}
      MDARIX_SITE_LOGIN_HASH: ${MDARIX_SITE_LOGIN_HASH:-}
      MDARIX_WWW_REDIRECT: ${MDARIX_WWW_REDIRECT:-off}
      MDARIX_REDIRECT_DOMAINS: ${MDARIX_REDIRECT_DOMAINS:-}
    read_only: true
    # Certificates and Caddy's state live on the two volumes; nothing else is written.
    tmpfs:
      - /tmp:size=16m
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      # The free-trial videos the website shows at /videos (videos/README.md).
      - ./videos:/media/videos:ro
    security_opt:
      - no-new-privileges:true
    # Caddy runs as the image's caddy user (uid 10002, Dockerfile.web) with no capability at all: in this container's
    # own network namespace ports from 80 up need none (the host's setting is not changed).
    cap_drop: [ALL]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "80"
    mem_limit: 256m
    cpus: 1.0
    healthcheck:
      # Caddy's admin API answers on localhost only; it lists the API upstream once the configuration is loaded.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/reverse_proxy/upstreams"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      api: {condition: service_healthy}
      web-volumes: {condition: service_completed_successfully}
    networks: [internal]
    logging: *logging

  # One-shot, before every start of web: gives Caddy's two volumes to the caddy user (infrastructure/docker/
  # caddy-volumes.sh). Volumes written while Caddy ran as root (0.10.46 and earlier) hold the certificates of every
  # domain and the ACME account; afterwards there is nothing to change and it ends at once. It runs as root with only
  # the capabilities to change an owner and to look into folders it does not own, and no network. Before going back
  # to a release that runs Caddy as root: docker compose run --rm --no-deps web-volumes 0:0
  web-volumes:
    image: ${MDARIX_IMAGE_REPOSITORY:-mdarix}/web:${MDARIX_RELEASE:-latest}
    user: "0:0"
    entrypoint: ["caddy-volumes"]
    restart: "no"
    read_only: true
    network_mode: none
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH]
    mem_limit: 64m
    cpus: 0.5
    logging: *logging

  # One-shot: schema migrations, the least-privilege runtime role, the application grants and the system-scope token.
  # Runs before every start of the API and the background service. It is the only service besides backup that loads
  # .env.migrate: the owner's credentials (MDARIX_DB_OWNER_USER from .env.production, MDARIX_DB_OWNER_PASSWORD from
  # .env.migrate) become its POSTGRES_USER / POSTGRES_PASSWORD, so anything run in it, such as
  #   docker compose -f docker-compose.prod.yml --env-file .env.production run --rm migrate python scripts/create_platform_admin.py ...
  # acts as the owner, while the long-running services never hold the owner password.
  migrate:
    <<: *app
    restart: "no"
    env_file: [.env.production, .env.migrate]
    entrypoint:
      - /bin/sh
      - -c
      - >-
        : "$${MDARIX_DB_OWNER_USER:?set MDARIX_DB_OWNER_USER in .env.production}"
        "$${MDARIX_DB_OWNER_PASSWORD:?set MDARIX_DB_OWNER_PASSWORD in .env.migrate}"
        && export POSTGRES_USER="$$MDARIX_DB_OWNER_USER" POSTGRES_PASSWORD="$$MDARIX_DB_OWNER_PASSWORD"
        && exec "$$@"
      - migrate-as-owner
    command:
      - sh
      - -c
      - >-
        alembic upgrade head
        && python scripts/configure_runtime_role.py
        && python scripts/grant_runtime_privileges.py
        && python scripts/set_rls_system_token.py
        && python scripts/migrate_data_planes.py --apply
    environment:
      MDARIX_DB_HARDENING_APPLY: "1"
    volumes:
      - *db-ca
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      disable: true

  api:
    <<: *app
    volumes:
      - objects:/var/lib/mdarix/objects
      - reports:/var/lib/mdarix/reports
      # The lawyer-approved privacy policy, terms and trial agreement (legal/README.md).
      - ./legal:/var/lib/mdarix/legal:ro
      - *db-ca
    environment:
      MDARIX_LEGAL_DIR: /var/lib/mdarix/legal
      MDARIX_OBJECT_STORAGE_ROOT: /var/lib/mdarix/objects
      MDARIX_REPORT_TEMP_ROOT: /var/lib/mdarix/reports
      MDARIX_TRUSTED_PROXY_HOPS: "1"
      MDARIX_CLAMD_HOST: clamav
    # uvicorn finishes requests in flight for up to 20 s (--timeout-graceful-shutdown) before Docker kills it.
    stop_grace_period: 30s
    mem_limit: 2g
    cpus: 2.0
    depends_on:
      migrate: {condition: service_completed_successfully}
      clamav: {condition: service_healthy}

  # The one background service (ADR: MVP slim-down): the outbox worker (emails, report jobs, exports) and the scheduler
  # (detection, reminders, retention, audit-chain checks) as two processes in one container (scripts/run_background.py).
  # Each keeps its own loop and heartbeat file; the health check needs both, and if either process stops the container
  # exits and Docker restarts it. The scheduler's external heartbeat (MDARIX_SCHEDULER_HEARTBEAT_URL) alerts as before.
  background:
    <<: *app
    command: ["python", "scripts/run_background.py"]
    volumes:
      - objects:/var/lib/mdarix/objects
      - reports:/var/lib/mdarix/reports
      - *db-ca
      # Every process passes the same configuration gate, which reads the legal documents (config_check.py).
      - ./legal:/var/lib/mdarix/legal:ro
    environment:
      MDARIX_LEGAL_DIR: /var/lib/mdarix/legal
      MDARIX_OBJECT_STORAGE_ROOT: /var/lib/mdarix/objects
      MDARIX_REPORT_TEMP_ROOT: /var/lib/mdarix/reports
      MDARIX_OUTBOX_HEARTBEAT_FILE: /tmp/mdarix-outbox-heartbeat.json
      MDARIX_SCHEDULER_HEARTBEAT_FILE: /tmp/mdarix-scheduler-heartbeat
    healthcheck:
      # Healthy only when both loops are alive: the worker writes its heartbeat every cycle (stale after 60 s), the
      # scheduler touches its file after every cycle of 30 s (stale after 120 s).
      test: ["CMD", "python", "-c", "import datetime,json,os,sys,time; d=json.load(open('/tmp/mdarix-outbox-heartbeat.json')); worker=time.time()-datetime.datetime.fromisoformat(d['updated_at']).timestamp() < 60; scheduler=time.time()-os.path.getmtime('/tmp/mdarix-scheduler-heartbeat') < 120; sys.exit(0 if worker and scheduler else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    # SIGTERM is passed to both processes, which finish the event, report or job in hand before they stop.
    stop_grace_period: 60s
    mem_limit: 1536m
    cpus: 1.5
    # A quarter of the default CPU weight (1024): when the API, the database and this service all want the CPU (an
    # import's embeddings run here), the API and the database come first; on an idle server this service still gets
    # its 1.5 CPUs.
    cpu_shares: 256
    depends_on:
      migrate: {condition: service_completed_successfully}

  # Virus scanning for every uploaded file (object_storage/service.py, clamd INSTREAM). Signatures refresh daily.
  # Pinned by digest (clamav/clamav:1.4, published for x86-64 only); Dependabot proposes updates. An ARM server uses
  # clamav/clamav-debian instead (docker-compose.staging-oracle.yml).
  clamav:
    image: clamav/clamav:1.4@sha256:57deb108fc4c72778aa83eafbca7bb7153e28c3f57c005afd38d31f16da86f23
    restart: unless-stopped
    networks: [internal]
    volumes:
      - clamav_db:/var/lib/clamav
    environment:
      # The image writes CLAMD_CONF_* settings into clamd.conf at start. With the parallel reload off, clamd does not
      # hold two signature databases in memory during the daily update (scans pause for a few seconds instead), so
      # its limit drops from 2 GB to 1.5 GB.
      CLAMD_CONF_ConcurrentDatabaseReload: "no"
    mem_limit: 1536m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      # A fresh signature volume can take more than ten minutes on a constrained validation runner. During the start
      # period Compose still checks readiness, but it does not fail the service while freshclam performs that initial
      # download. Steady-state failures are still detected after startup.
      retries: 10
      start_period: 900s
    logging: *logging

  # Encrypted backups (host cron, docs/runbooks/BACKUP_AND_RESTORE.md):
  #   docker compose -f docker-compose.prod.yml --env-file .env.production --profile backup run --rm backup
  # Loads .env.migrate for its database login (MDARIX_BACKUP_DB_USER, else the owner) and the bucket keys.
  backup:
    profiles: ["backup"]
    build:
      context: .
      dockerfile: infrastructure/docker/backup/Dockerfile
    image: ${MDARIX_IMAGE_REPOSITORY:-mdarix}/backup:${MDARIX_RELEASE:-latest}
    env_file: [.env.production, .env.migrate]
    restart: "no"
    networks: [internal]
    volumes:
      # Owned by uid 70 (postgres in the image): sudo install -d -o 70 -g 70 -m 700 /var/backups/mdarix
      - ${MDARIX_BACKUP_DIR:-/var/backups/mdarix}:/backups
      - objects:/objects:ro
      - *db-ca
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 1g
    cpus: 1.0
    logging: *logging

networks:
  internal: {}

volumes:
  caddy_data: {}
  caddy_config: {}
  objects: {}
  reports: {}
  clamav_db: {}
