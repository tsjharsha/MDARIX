[pytest]
testpaths = tests
# Data-plane tests need the separately provisioned tenant data-plane databases
# (docker compose tenant-a..d plus scripts/register_mvp_data_planes.py) and
# write into them, so they are opt-in:  python -m pytest -m dataplane
addopts = -m "not dataplane"
markers =
    unit: pure logic or static checks; no database, network or containers required
    db: requires the control-plane PostgreSQL test database (mdarix_r1_test locally)
    dataplane: additionally requires the four tenant data-plane PostgreSQL services
